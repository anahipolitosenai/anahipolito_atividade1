<!DOCTYPE html>
<html lang="pr-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore o Mundo - Expedições</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header class="cabecalho"> <!-- cabeçalho -->
        <div class="logo">
           <i class="fa-solid fa-earth-americas"></i>
           <span>Explore o Mundo</span>
        </div>

        <div class="navegacao">
            <nav class="menu-links">
                <a href="index.html">Início</a>
                <a href="destinos.html">Destinos</a>
                <a href="sobre_nos.html">Sobre</a>
                <a href="contato.html">Contato</a>
            </nav>

            <div class="redes-sociais">
                <a href="" class="whatsapp"><i class="fa-brands fa-whatsapp"></i></a>
                <a href="" class="face"><i class="fa-brands fa-facebook"></i></a>
                <a href="" class="insta"><i class="fa-brands fa-square-instagram"></i></a>
                <a href="" class="twitter"><i class="fa-brands fa-x-twitter"></i></a>
            </div>
        </div>
        </header>

        <div class="contato">

        <h2>Entre em Contato</h2>

        <p>
            Preencha seus dados e nossa equipe entrará em contato
            para ajudar a montar sua viagem.
        </p>

        <form>

            <label for="nome">Nome completo</label>
            <input 
                type="text" 
                id="nome" 
                name="nome"
                placeholder="Digite seu nome"
                required
            >

            <label for="email">E-mail</label>
            <input 
                type="email" 
                id="email" 
                name="email"
                placeholder="seuemail@email.com"
                required
            >

            <label for="telefone">Telefone / WhatsApp</label>
            <input 
                type="tel" 
                id="telefone" 
                name="telefone"
                placeholder="(00) 00000-0000"
                required
            >

            <label for="destino">Destino desejado</label>
            <input 
                type="text" 
                id="destino" 
                name="destino"
                placeholder="Ex.: Paris, Orlando, Nordeste..."
            >

            <label for="contato">Como prefere ser atendido?</label>
            <select id="contato" name="contato">
                <option value="">Selecione</option>
                <option value="whatsapp">WhatsApp</option>
                <option value="email">E-mail</option>
                <option value="telefone">Ligação</option>
            </select>

            <label for="mensagem">Mensagem</label>
            <textarea 
                id="mensagem" 
                name="mensagem"
                placeholder="Conte um pouco sobre a viagem que você deseja..."
            ></textarea>

            <button type="submit">
                Enviar solicitação
            </button>

        </form>

    </div>
